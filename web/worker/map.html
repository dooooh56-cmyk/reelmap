<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#map{height:100%;margin:0;font-family:-apple-system,sans-serif}#state{padding:24px;color:#315740}#map{display:none}</style></head><body><div id="state">카카오 지도를 연결하고 있습니다.</div><div id="map"></div><script>
let map,markers=[],latest=[];window.updatePlaces=function(places){latest=places;if(!map)return;markers.forEach(m=>m.setMap(null));markers=places.map(p=>new kakao.maps.Marker({map,position:new kakao.maps.LatLng(p.lat,p.lng),title:p.name}));if(places.length)map.setCenter(new kakao.maps.LatLng(places[0].lat,places[0].lng));};window.centerOn=function(lat,lng){if(map){map.setCenter(new kakao.maps.LatLng(lat,lng));map.setLevel(4);}};
fetch('/api/config').then(r=>r.json()).then(c=>{if(!c.mapJSKey){document.getElementById('state').textContent='카카오 지도 키 설정이 필요합니다. 식당 목록의 카카오맵 링크를 사용할 수 있습니다.';return;}const s=document.createElement('script');s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+encodeURIComponent(c.mapJSKey)+'&autoload=false';s.onerror=()=>{document.getElementById('state').textContent='지도 연결 실패: 카카오 웹 플랫폼에 이 서버 주소를 등록해 주세요.';};s.onload=()=>{kakao.maps.load(()=>{document.getElementById('state').hidden=true;document.getElementById('map').style.display='block';map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(37.556,126.923),level:6});window.updatePlaces(latest);});};document.head.append(s);}).catch(()=>{document.getElementById('state').textContent='서버 연결에 실패했습니다.';});
</script></body></html>
